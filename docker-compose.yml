version: '3.8'

services:
  # MeiliSearch 搜索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: yinxin-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_API_KEY:-your_master_key_here}
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - yinxin-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yinxin-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_API_KEY=${MEILI_API_KEY:-your_master_key_here}
      - JWT_SECRET=${JWT_SECRET:-replace_with_a_long_random_secret}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-your_qq_email@example.com}
      - SMTP_PASS=${SMTP_PASS:-your_smtp_auth_code}
      - MAIL_FROM=${MAIL_FROM:-吟心 <your_qq_email@example.com>}
    volumes:
      - ./backend/data:/app/data
      - ./data:/app/data/external
    depends_on:
      - meilisearch
    restart: unless-stopped
    networks:
      - yinxin-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:3000/api}
    container_name: yinxin-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - yinxin-network

volumes:
  meilisearch_data:
    driver: local

networks:
  yinxin-network:
    driver: bridge

