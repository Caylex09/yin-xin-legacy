<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" />
  <title>未找到页面 · 吟心</title>
  <style>
    :root {
      font-family: "Inter", "MiSans", "PingFang SC", system-ui, sans-serif;
      color: #2c1a0d;
      background: radial-gradient(circle at 20% 20%, #ffe8c2 0, #faf3e8 35%, #f7efe2 100%);
      line-height: 1.6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 190, 140, 0.6);
      border-radius: 18px;
      padding: 28px 24px;
      width: min(420px, 90vw);
      box-shadow: 0 12px 30px rgba(168, 108, 70, 0.18);
      text-align: center;
    }
    h1 { margin: 0 0 10px; color: #b85c32; font-size: 28px; }
    p { margin: 6px 0 16px; color: #8f694a; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffb57f, #ff9070);
      color: #3a1f12;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(255, 146, 112, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>抱歉，页面不存在或已被移动。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
